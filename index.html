<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房貸承擔力試算</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",Roboto;
  background:#f5f6f7;
  padding:20px;
}
.card{
  max-width:720px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
h2{margin-top:25px}
input{
  width:100%;
  padding:8px;
  margin:5px 0 10px 0;
  border-radius:8px;
  border:1px solid #ccc;
}
.resultBox{
  margin-top:15px;
  padding:15px;
  background:#f2fbf3;
  border-radius:10px;
  border:1px solid #d8f1da;
  line-height:1.8;
}
button{
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  width:100%;
  background:#06C755;
  color:#fff;
  font-size:15px;
}

/* ── 新增：情境分析區塊 ── */
#situationBox{
  margin-top:16px;
  padding:14px 16px;
  border-radius:10px;
  line-height:1.75;
  font-size:14px;
  display:none;
}
#situationBox .sit-title{
  font-weight:bold;
  font-size:15px;
  margin-bottom:6px;
}

/* ── 新增：狀況標籤 ── */
.tag-section{
  margin-top:20px;
}
.tag-section .tag-title{
  font-size:14px;
  font-weight:bold;
  color:#333;
  margin-bottom:10px;
}
.tag-section .tag-sub{
  font-size:12px;
  color:#888;
  margin-bottom:12px;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.tag{
  padding:7px 14px;
  border-radius:20px;
  border:1.5px solid #ccc;
  font-size:13px;
  color:#666;
  cursor:pointer;
  background:#fff;
  width:auto;
  font-weight:normal;
  transition:all 0.15s;
}
.tag.selected{
  border-color:#06C755;
  background:#e8faf0;
  color:#059A42;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="card">

<h1>房貸承擔力試算</h1>

<h2>第一部分｜收入</h2>
<input type="number" id="salary" placeholder="薪資">
<input type="number" id="parttime" placeholder="兼職">
<input type="number" id="dividend" placeholder="配息其他">
<b>每月固定收入合計：<span id="incomeSum">NT$ 0</span></b>

<h2>第二部分｜支出（不含房租）</h2>
<input type="number" id="parents" placeholder="孝親費">
<input type="number" id="utility" placeholder="水電瓦斯">
<input type="number" id="phone" placeholder="手機月租">
<input type="number" id="insurance" placeholder="保險">
<input type="number" id="entertain" placeholder="娛樂支出">
<input type="number" id="food" placeholder="餐費">
<input type="number" id="transport" placeholder="通勤交通費">
<input type="number" id="loan" placeholder="信貸/車貸等（含其他分期）">
<input type="number" id="other" placeholder="其他">
<b>每月固定支出合計：<span id="expenseSum">NT$ 0</span></b>

<h2>第三部分｜試算結果</h2>

<div id="warning" style="display:none;color:#b00020;font-weight:bold;margin-bottom:10px;">
  扣除固定支出後現金流不足（≤0），目前不建議增加房貸月付，建議先調整支出或負債結構。
</div>

<div class="resultBox">
  1️⃣ 扣除後你能負擔的房貸約：<br>
  <b id="R">NT$ 0</b>
  <hr>
  2️⃣ 依照普遍銀行計算能負擔的房貸是你收入的 70%：<br>
  <b id="B70">NT$ 0</b>
  <hr>
  3️⃣ 依你的負擔權重（以餘額計）：<br>
  餘額的 70%（保守）：<b id="R70">NT$ 0</b><br>
  餘額的 80%（積極）：<b id="R80">NT$ 0</b>
</div>

<!-- ── 新增：情境分析 ── -->
<div id="situationBox">
  <div class="sit-title" id="sitTitle"></div>
  <div id="sitText"></div>
</div>

<!-- ── 新增：狀況標籤 ── -->
<div class="tag-section">
  <div class="tag-title">你的狀況比較像哪一種？</div>
  <div class="tag-sub">勾選後傳給RAY，評估更精準</div>
  <div class="tags">
    <button class="tag" onclick="toggleTag(this)">現金收入為主</button>
    <button class="tag" onclick="toggleTag(this)">信用曾有瑕疵</button>
    <button class="tag" onclick="toggleTag(this)">房子非自己名下</button>
    <button class="tag" onclick="toggleTag(this)">需要資金週轉</button>
    <button class="tag" onclick="toggleTag(this)">被其他銀行拒過</button>
  </div>
</div>

<div style="margin-top:20px;">
  <button onclick="sendToOA()">
    傳送結果給RAY洪爺，免費諮詢
  </button>
</div>

<div style="margin-top:20px;padding:15px;border-radius:10px;background:#e3f2fd;">
  RAY洪爺協助
  透過房貸、負債整合或增貸規劃，<br>
  提高核貸成功率或優化月付金額。
</div>

</div>

<script>
function fmt(n){
  return "NT$ " + Number(n).toLocaleString("zh-Hant-TW");
}

function val(id){
  const v = Number(document.getElementById(id).value);
  return Number.isFinite(v) && v > 0 ? v : 0;
}

function calc(){
  const income =
    val("salary") + val("parttime") + val("dividend");

  const expense =
    val("parents") + val("utility") + val("phone") +
    val("insurance") + val("entertain") + val("food") +
    val("transport") + val("loan") + val("other");

  const balanceRaw = income - expense;

  document.getElementById("incomeSum").innerText = fmt(income);
  document.getElementById("expenseSum").innerText = fmt(expense);

  document.getElementById("warning").style.display =
    balanceRaw <= 0 ? "block" : "none";

  const balance = balanceRaw > 0 ? balanceRaw : 0;

  document.getElementById("R").innerText = fmt(balance);
  document.getElementById("B70").innerText = fmt(income * 0.7);
  document.getElementById("R70").innerText = fmt(balance * 0.7);
  document.getElementById("R80").innerText = fmt(balance * 0.8);

  updateSituation(income, balance);
}

/* ── 新增：情境分析邏輯 ── */
function updateSituation(income, balance){
  const box = document.getElementById("situationBox");
  const title = document.getElementById("sitTitle");
  const text = document.getElementById("sitText");

  if(income === 0){
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  const ratio = balance / income;

  if(balance <= 0){
    box.style.background = "#fff8f0";
    box.style.border = "1px solid #ffd4a0";
    box.style.color = "#c05000";
    title.innerText = "⚠️ 目前支出壓力偏高";
    text.innerText = "扣除支出後現金流不足，但不代表完全沒有機會。有時候可以透過負債整合或其他方式改善結構。建議直接把你的狀況傳給我，我幫你評估看看。";
  } else if(ratio >= 0.4){
    box.style.background = "#e8faf0";
    box.style.border = "1px solid #a8e6b8";
    box.style.color = "#059A42";
    title.innerText = "✅ 還款能力良好";
    text.innerText = "你的收支結構健康，扣除固定支出後還有不錯的餘額，核貸條件相對有利。建議把試算結果傳給我，我幫你確認實際可以貸多少、最適合哪個方案。";
  } else {
    box.style.background = "#f0f7ff";
    box.style.border = "1px solid #b8d4f0";
    box.style.color = "#1a6fc4";
    title.innerText = "📊 有討論空間";
    text.innerText = "餘額比例偏低，一般銀行可能比較保守評估，但不代表沒機會。我們銀行的審核彈性比較大，不同狀況有不同的處理方式。歡迎把你的狀況傳給我，我幫你找最適合的方案。";
  }
}

/* ── 新增：標籤切換 ── */
function toggleTag(el){
  el.classList.toggle("selected");
}

function getSelectedTags(){
  const selected = [...document.querySelectorAll(".tag.selected")].map(t => t.innerText);
  return selected.length > 0 ? selected.join("、") : "";
}

/* ── 修改：LINE訊息格式化，加入標籤 ── */
function generateMessage(){
  const tags = getSelectedTags();
  let msg = `【房貸試算結果】
─────────────
每月固定收入：${document.getElementById("incomeSum").innerText}
每月固定支出：${document.getElementById("expenseSum").innerText}
可負擔餘額：${document.getElementById("R").innerText}
─────────────
銀行標準（收入×70%）：${document.getElementById("B70").innerText}
保守月付（餘額×70%）：${document.getElementById("R70").innerText}
積極月付（餘額×80%）：${document.getElementById("R80").innerText}`;

  if(tags){
    msg += `\n─────────────\n我的狀況：${tags}`;
  }

  msg += "\n\n請幫我評估實際核貸可能性，謝謝！";
  return msg;
}

function sendToOA(){
  const text = encodeURIComponent(generateMessage());
  window.location.href = `https://line.me/R/oaMessage/@374zssez/?${text}`;
}

document.addEventListener("input", function(e){
  if(e.target.matches("input")) calc();
});

calc();
</script>

</body>
</html>
