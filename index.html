<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>金豬帳本</title>
<style>
  :root{
    --bg:#191A1D; --card:#232529; --card-2:#2A2C31; --border:#34363B;
    --ink:#EDE7DB; --ink-dim:#9A968C; --brass:#C9A03D; --brass-dim:#8A7230;
    --pos:#7C9A7E; --neg:#B5615A; --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; background:#0C0D0F; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:var(--ink); }
  #app{ display:flex; justify-content:center; min-height:100vh; }
  .shell{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); position:relative; display:flex; flex-direction:column; }
  .screen{ flex:1; overflow-y:auto; padding-bottom:90px; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:28px 20px 8px; }
  .topbar .title{ font-size:22px; font-weight:600; }
  .dial{ width:36px; height:36px; border-radius:50%; border:1.5px solid var(--brass-dim);
    display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
    background:radial-gradient(circle at 35% 30%, #2E2A1E, #1c1a14); flex-shrink:0; }
  .dial::after{ content:''; width:3px; height:9px; background:var(--brass); border-radius:2px;
    position:absolute; top:6px; transition:transform .3s ease; }
  .dial.private::after{ transform:rotate(180deg); background:var(--ink-dim); }
  .blurred{ filter:blur(6px); user-select:none; }

  .card{ margin:14px 20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .card-label{ font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-dim); font-weight:600; margin-bottom:10px; }

  .btn{ border:none; border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .btn-primary{ background:var(--brass); color:#1a1608; }
  .btn-secondary{ background:var(--card-2); color:var(--ink); border:1px solid var(--border); }
  .btn-danger{ background:transparent; color:var(--neg); border:1px solid var(--neg); }
  .btn-block{ width:100%; }
  .btn:disabled{ opacity:.4; }

  input[type=text], select{ width:100%; background:var(--card-2); border:1px solid var(--border);
    border-radius:8px; padding:9px 11px; color:var(--ink); font-size:13.5px; outline:none; }
  label{ display:block; font-size:11px; color:var(--ink-dim); margin-bottom:5px; }
  .field{ margin-bottom:12px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; margin-bottom:0; }

  .type-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .type-chip{ padding:9px 16px; border-radius:999px; font-size:13px; font-weight:500;
    background:var(--card-2); border:1px solid var(--border); color:var(--ink-dim); cursor:pointer; }
  .type-chip.active{ background:var(--brass); color:#1a1608; border-color:var(--brass); }

  .tabbar{ position:absolute; bottom:0; left:0; right:0; background:rgba(25,26,29,0.95);
    backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex; padding:10px 0 18px; }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-dim); font-size:10px; cursor:pointer; background:none; border:none; }
  .tab.active{ color:var(--brass); }
  .tab .ic{ font-size:19px; }

  .subtabs{ display:flex; gap:8px; margin:8px 20px 4px; overflow-x:auto; }
  .subtab{ flex-shrink:0; padding:8px 15px; border-radius:999px; background:var(--card);
    border:1px solid var(--border); color:var(--ink-dim); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .subtab.active{ background:var(--brass); color:#1a1608; border-color:var(--brass); }

  .row{ display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
  .row:last-child{ border-bottom:none; }
  .row-icon{ width:34px; height:34px; border-radius:9px; background:var(--card-2);
    display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-size:13.5px; font-weight:500; }
  .row-sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .row-val{ font-size:13px; font-weight:600; white-space:nowrap; }
  .row-del{ color:var(--neg); font-size:12px; cursor:pointer; padding:4px 8px; flex-shrink:0; }

  .empty-hint{ text-align:center; color:var(--ink-dim); font-size:12.5px; padding:26px 10px; }

  .split-cols{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 20px; }
  .col{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 12px; min-height:120px; }
  .col-head{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-dim);
    text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .col-head .sum{ margin-left:auto; font-size:11px; color:var(--brass); font-weight:600; }
  .mini-item{ padding:7px 0; border-bottom:1px solid var(--border); }
  .mini-item:last-child{ border-bottom:none; }
  .mini-title{ font-size:12.5px; font-weight:500; }
  .mini-sub{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }

  .input-row{ margin:14px 20px; display:flex; align-items:center; gap:12px; }
  .mic-btn{ width:60px; height:60px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #E3BC5C, var(--brass) 65%);
    display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; flex-shrink:0; border:none; }
  .mic-btn.recording{ background:radial-gradient(circle at 35% 30%, #E38C8C, var(--neg) 65%); animation:micPulse 1.1s ease-in-out infinite; }
  @keyframes micPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  .input-texts{ flex:1; }
  .input-hint{ font-size:13px; font-weight:500; }
  .input-sub{ font-size:11px; color:var(--ink-dim); margin-top:2px; }
  .ai-banner{ background:rgba(201,160,61,0.1); border:1px solid var(--brass-dim); border-radius:10px; padding:9px 11px; font-size:12px; color:var(--brass); margin-bottom:12px; }
  .voice-error{ background:rgba(181,97,90,0.1); border:1px solid var(--neg); border-radius:10px; padding:9px 11px; font-size:12px; color:var(--neg); margin-bottom:12px; line-height:1.5; }

  .group-label{ font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--brass-dim); font-weight:600; margin:20px 20px 8px; }

  .chip-list{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
  .chip{ display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; font-size:12px;
    background:var(--card-2); border:1px solid var(--border); color:var(--ink); }
  .chip .del{ color:var(--neg); cursor:pointer; font-weight:700; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{ flex:1; }

  .piggy-hero{ margin:14px 20px; background:linear-gradient(155deg, #2A2413, var(--card) 60%);
    border:1px solid var(--brass-dim); border-radius:var(--radius); padding:20px; }
  .piggy-label{ font-size:12px; letter-spacing:1.2px; text-transform:uppercase; color:var(--brass); font-weight:600; }
  .piggy-amount{ font-size:30px; font-weight:700; margin-top:6px; }
  .piggy-progress{ height:5px; background:rgba(255,255,255,0.08); border-radius:4px; margin-top:14px; overflow:hidden; }
  .piggy-progress-fill{ height:100%; background:var(--brass); }

  .goal-card{ margin:14px 20px; background:var(--card); border:1px solid var(--brass-dim); border-radius:var(--radius); padding:16px; }
  .goal-track{ height:6px; background:var(--card-2); border-radius:4px; overflow:hidden; margin-top:8px; }
  .goal-track-fill{ height:100%; background:linear-gradient(90deg,var(--brass-dim),var(--brass)); }

  .bars-wrap{ display:flex; gap:6px; }
  .bar-col{ flex:1; text-align:center; }
  .bar-chart{ display:flex; align-items:flex-end; height:80px; }
  .bar{ width:100%; background:var(--brass); border-radius:3px 3px 0 0; min-height:2px; }
  .bar-label{ font-size:9px; color:var(--ink-dim); margin-top:4px; }

  .onboard-wrap{ min-height:100vh; padding:70px 24px 30px; position:relative; }
  .ob-step{ display:none; flex-direction:column; min-height:calc(100vh - 100px); }
  .ob-step.active{ display:flex; }
  .progress-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:28px; }
  .pdot{ width:6px; height:6px; border-radius:50%; background:var(--card-2); }
  .pdot.active{ background:var(--brass); width:18px; border-radius:3px; }
  .step-title{ font-size:22px; font-weight:600; margin-bottom:6px; }
  .step-sub{ font-size:13px; color:var(--ink-dim); margin-bottom:24px; line-height:1.6; }
  .gender-row{ display:flex; gap:8px; }
  .gender-opt{ flex:1; text-align:center; padding:11px; border-radius:10px; background:var(--card);
    border:1px solid var(--border); color:var(--ink-dim); font-size:13px; cursor:pointer; }
  .gender-opt.selected{ background:var(--brass); color:#1a1608; border-color:var(--brass); font-weight:600; }
  .activity-opt{ display:flex; justify-content:space-between; align-items:center; padding:12px;
    border-radius:10px; background:var(--card-2); border:1px solid var(--border); margin-bottom:8px; cursor:pointer; }
  .activity-opt.selected{ border-color:var(--brass-dim); background:rgba(201,160,61,0.08); }
  .skip-link{ position:absolute; top:28px; right:24px; font-size:12.5px; color:var(--ink-dim); cursor:pointer; z-index:5; }
  .spacer{ flex:1; }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

var STORAGE_KEY = 'raylife_data_v1';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayISO(){ return new Date().toISOString(); }
function isToday(iso){
  var d = new Date(iso), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}
function fmtDate(iso){
  var d = new Date(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function defaultData(){
  return {
    onboardingCompleted:false, userProfile:null,
    financeRecords:[], foodRecords:[], exerciseRecords:[], bodyRecords:[], piggyRecords:[],
    financeCategories:['餐飲','交通','購物','娛樂','醫療','其他'],
    foodCategories:['主食','飲料','點心','水果','其他'],
    accounts:['現金','銀行帳戶'],
    budget:{ monthlyAmount:null },
    piggyGoal:null, personalGoal:null, privacyMode:false,
    aiConfig:{ provider:'gemini', geminiKey:'', geminiModel:'gemini-2.5-flash', claudeKey:'', claudeModel:'claude-haiku-4-5' }
  };
}

var S = loadData();
var UI = { page:'home', recordsTab:'food', showAddForm:false, obStep:1, obActivityIdx:0, obGoalType:'weight',
  obHeightVal:'', obWeightVal:'', obAgeVal:'', obGenderVal:'男', obGoalTargetVal:'', obRewardVal:'',
  voiceOpen:false, voiceState:'idle', voiceTranscript:'', voiceError:null, prefill:null };
var _recognition = null;

function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ var parsed = JSON.parse(raw); var d = defaultData(); for(var k in parsed){ d[k]=parsed[k]; } return d; }
  }catch(e){}
  return defaultData();
}
function saveData(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }catch(e){} }

var ACTIVITY_LEVELS = [
  {name:'久坐', sub:'很少或沒有運動', coef:1.2},
  {name:'輕度活動', sub:'每週約1～3天輕度活動', coef:1.375},
  {name:'中等活動', sub:'每週約3～5天有運動或活動', coef:1.55},
  {name:'高度活動', sub:'每週約6～7天有運動', coef:1.725},
  {name:'非常高度活動', sub:'體力勞動或高強度訓練', coef:1.9}
];

function render(){
  var root = document.getElementById('app');
  if(!S.onboardingCompleted){
    root.innerHTML = renderOnboarding();
  } else {
    root.innerHTML = renderMain();
  }
}

function renderOnboarding(){
  var html = '<div class="shell"><div class="onboard-wrap">';
  html += '<div class="skip-link" id="skipLink" onclick="obSkip()">略過 →</div>';
  html += '<div class="progress-dots">';
  for(var i=1;i<=3;i++){ html += '<div class="pdot'+(UI.obStep===i?' active':'')+'"></div>'; }
  html += '</div>';

  html += '<div class="ob-step'+(UI.obStep===1?' active':'')+'" id="obStep1">';
  html += '<div class="step-title">先認識你一下</div>';
  html += '<div class="step-sub">這些數字只用來幫你計算每日熱量消耗，全部存在你的手機裡，不會上傳雲端</div>';
  html += '<div class="field"><label>身高 (cm)</label><input type="text" id="obHeight" value="'+esc(UI.obHeightVal)+'" placeholder="例：175" oninput="obCheckStep1()"></div>';
  html += '<div class="field"><label>體重 (kg)</label><input type="text" id="obWeight" value="'+esc(UI.obWeightVal)+'" placeholder="例：70" oninput="obCheckStep1()"></div>';
  html += '<div class="field"><label>年齡</label><input type="text" id="obAge" value="'+esc(UI.obAgeVal)+'" placeholder="例：35" oninput="obCheckStep1()"></div>';
  html += '<div class="field"><label>性別</label><div class="gender-row" id="obGenderRow">';
  ['男','女','其他'].forEach(function(g){
    html += '<div class="gender-opt'+(UI.obGenderVal===g?' selected':'')+'" data-g="'+g+'" onclick="obSelectGender(this)">'+g+'</div>';
  });
  html += '</div></div>';
  html += '<div class="spacer"></div>';
  html += '<button class="btn btn-primary btn-block" id="obNext1"'+(UI.obHeightVal&&UI.obWeightVal&&UI.obAgeVal?'':' disabled')+' onclick="obGoStep(2)">下一步</button>';
  html += '</div>';

  html += '<div class="ob-step'+(UI.obStep===2?' active':'')+'" id="obStep2">';
  html += '<div class="step-title">平常活動量大概是？</div>';
  html += '<div class="step-sub">用來估算你的每日熱量消耗，之後在設定裡隨時可以調整</div>';
  ACTIVITY_LEVELS.forEach(function(lv,i){
    html += '<div class="activity-opt'+(UI.obActivityIdx===i?' selected':'')+'" data-i="'+i+'" onclick="obSelectActivity(this)">';
    html += '<div><div style="font-weight:500;font-size:13.5px">'+lv.name+'</div><div style="font-size:10.5px;color:var(--ink-dim)">'+lv.sub+'</div></div>';
    html += '<div style="color:var(--brass);font-size:12px">'+lv.coef+'</div></div>';
  });
  html += '<div class="spacer"></div>';
  html += '<button class="btn btn-primary btn-block" onclick="obGoStep(3)">下一步</button>';
  html += '<div class="step-sub" style="text-align:center;cursor:pointer;margin-top:10px" onclick="obGoStep(1)">← 上一步</div>';
  html += '</div>';

  html += '<div class="ob-step'+(UI.obStep===3?' active':'')+'" id="obStep3">';
  html += '<div class="step-title">給自己一個目標</div>';
  html += '<div class="step-sub">達成之後想怎麼犒賞自己？寫下來更有動力</div>';
  html += '<div class="field"><label>目標類型</label><div class="type-chips" id="obGoalTypeRow">';
  html += '<div class="type-chip'+(UI.obGoalType==='weight'?' active':'')+'" data-t="weight" onclick="obSelectGoalType(this)">💪 體重</div>';
  html += '<div class="type-chip'+(UI.obGoalType==='savings'?' active':'')+'" data-t="savings" onclick="obSelectGoalType(this)">💰 存錢</div>';
  html += '<div class="type-chip'+(UI.obGoalType==='custom'?' active':'')+'" data-t="custom" onclick="obSelectGoalType(this)">✏️ 自訂</div>';
  html += '</div></div>';
  html += '<div id="obGoalTargetWrap">'+obGoalTargetFieldHTML()+'</div>';
  html += '<div class="field"><label>達成後的獎勵</label><input type="text" id="obReward" value="'+esc(UI.obRewardVal)+'" placeholder="例：買一直想要的相機鏡頭" oninput="UI.obRewardVal=this.value"></div>';
  html += '<div class="spacer"></div>';
  html += '<button class="btn btn-primary btn-block" onclick="obFinish()">完成，開始使用</button>';
  html += '<div class="step-sub" style="text-align:center;cursor:pointer;margin-top:10px" onclick="obGoStep(2)">← 上一步</div>';
  html += '</div>';

  html += '</div></div>';
  return html;
}

function obGoalTargetFieldHTML(){
  var v = esc(UI.obGoalTargetVal);
  if(UI.obGoalType==='weight') return '<div class="field"><label>目標體重 (kg)</label><input type="text" id="obGoalTarget" value="'+v+'" placeholder="例：60" oninput="UI.obGoalTargetVal=this.value"></div>';
  if(UI.obGoalType==='savings') return '<div class="field"><label>目標存款金額 (NT$)</label><input type="text" id="obGoalTarget" value="'+v+'" placeholder="例：100000" oninput="UI.obGoalTargetVal=this.value"></div>';
  return '<div class="field"><label>你的目標</label><input type="text" id="obGoalTarget" value="'+v+'" placeholder="例：連續30天不外食" oninput="UI.obGoalTargetVal=this.value"></div>';
}

function obCheckStep1(){
  var h = document.getElementById('obHeight').value.trim();
  var w = document.getElementById('obWeight').value.trim();
  var a = document.getElementById('obAge').value.trim();
  UI.obHeightVal = h; UI.obWeightVal = w; UI.obAgeVal = a;
  document.getElementById('obNext1').disabled = !(h && w && a);
}
function obSelectGender(el){
  UI.obGenderVal = el.getAttribute('data-g');
  document.querySelectorAll('#obGenderRow .gender-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected');
}
function obSelectActivity(el){
  UI.obActivityIdx = parseInt(el.getAttribute('data-i'));
  document.querySelectorAll('#obStep2 .activity-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected');
}
function obSelectGoalType(el){
  UI.obGoalType = el.getAttribute('data-t');
  document.querySelectorAll('#obGoalTypeRow .type-chip').forEach(function(o){ o.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('obGoalTargetWrap').innerHTML = obGoalTargetFieldHTML();
}
function obGoStep(n){ UI.obStep = n; render(); }
function obSkip(){ obFinish(); }

function obFinish(){
  // 讀 UI 狀態而不是即時 DOM：換步驟時 renderOnboarding() 會整個重繪，
  // 若只讀 DOM，前面步驟填的值會在切換步驟當下就被清空（曾經是個 bug）。
  var h = (UI.obHeightVal || '').trim();
  var w = (UI.obWeightVal || '').trim();
  var a = (UI.obAgeVal || '').trim();
  var gender = UI.obGenderVal || '男';

  var profile;
  if(h && w && a){
    profile = { heightCm:parseFloat(h), weightKg:parseFloat(w), age:parseInt(a), gender:gender, activityCoefficient:ACTIVITY_LEVELS[UI.obActivityIdx].coef };
  } else {
    profile = { heightCm:170, weightKg:65, age:30, gender:'男', activityCoefficient:1.2 };
  }

  var goalTarget = (UI.obGoalTargetVal || '').trim();
  var reward = (UI.obRewardVal || '').trim();
  var goal = null;
  if(goalTarget || reward){
    goal = { type:UI.obGoalType, targetValue: UI.obGoalType!=='custom' ? (parseFloat(goalTarget)||null) : null,
             targetText: UI.obGoalType==='custom' ? goalTarget : null, rewardText:reward };
  }

  S.userProfile = profile;
  S.personalGoal = goal;
  if(w){ S.bodyRecords.push({ id:uid(), date:todayISO(), weight:parseFloat(w), bodyFat:null, visceralFat:null }); }
  S.onboardingCompleted = true;
  saveData();
  UI.page = 'home';
  render();
}

function renderMain(){
  var html = '<div class="shell">';
  html += '<div id="screenContent">' + renderScreen() + '</div>';
  html += '<div class="tabbar">';
  html += tabBtn('home','🏠','首頁');
  html += tabBtn('records','📋','記錄');
  html += tabBtn('trends','📈','趨勢');
  html += tabBtn('settings','⚙️','設定');
  html += '</div></div>';
  return html;
}
function tabBtn(key, icon, label){
  return '<button class="tab'+(UI.page===key?' active':'')+'" onclick="goPage(\''+key+'\')"><div class="ic">'+icon+'</div>'+label+'</button>';
}
function goPage(p){
  stopRecognitionIfActive();
  UI.page = p; UI.showAddForm = false; UI.voiceOpen = false; UI.prefill = null;
  render();
}

function renderScreen(){
  if(UI.page==='home') return renderHome();
  if(UI.page==='records') return renderRecords();
  if(UI.page==='trends') return renderTrends();
  if(UI.page==='settings') return renderSettings();
  return '';
}

function renderHome(){
  var now = new Date();
  var todayFin = S.financeRecords.filter(function(r){return isToday(r.date);}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var todayFood = S.foodRecords.filter(function(r){return isToday(r.date);}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var todayEx = S.exerciseRecords.filter(function(r){return isToday(r.date);}).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  var finTotal = todayFin.reduce(function(s,r){ return s + (r.type==='expense'?-r.amount:r.amount); }, 0);

  var html = '<div class="screen">';

function speechSupported(){

}

}

function startRecording(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){
    UI.voiceError = { title:'⚠ 無法使用語音辨識', message:'這個瀏覽器不支援語音辨識，請直接在下方輸入文字後按「AI 解析」' };
    render();
    return;
  }
  try{
    _recognition = new SR();
    _recognition.lang = 'zh-TW';
    _recognition.interimResults = true;
    _recognition.continuous = false;
    _recognition.onresult = function(e){
      var text = '';
      for(var i=0;i<e.results.length;i++){ text += e.results[i][0].transcript; }
      UI.voiceTranscript = text;
      var el = document.getElementById('voiceTextInput');
      if(el){ el.value = text; } else { render(); }
    };
    _recognition.onerror = function(e){
      UI.voiceState = 'idle';
      UI.voiceError = { title:'⚠ 錄音發生問題', message:'麥克風權限或裝置問題（'+esc(e.error)+'），請改用下方文字輸入' };
      render();
    };
    _recognition.onend = function(){
      if(UI.voiceState==='recording'){ UI.voiceState = 'idle'; render(); }
    };
    UI.voiceState = 'recording';
    UI.voiceError = null;
    render();
    _recognition.start();
  }catch(err){
    UI.voiceState = 'idle';
    UI.voiceError = { title:'⚠ 無法啟動錄音', message:String(err && err.message ? err.message : err) };
    render();
  }
}
function stopRecording(){
  stopRecognitionIfActive();
  UI.voiceState = 'idle';
  render();
}

function submitVoiceText(){
  var el = document.getElementById('voiceTextInput');
  var text = (el ? el.value : UI.voiceTranscript).trim();
  if(!text){
    UI.voiceError = { title:'⚠ 沒有內容', message:'請先錄音，或直接輸入一句話再解析' };
    render();
    return;
  }
  stopRecognitionIfActive();
  parseWithAI(text);
}

function buildAIPrompt(text){
  var lines = [
    '你是一個記帳與健康記錄助理。使用者用語音（或文字）說了一句中文，請解析成結構化 JSON，只回傳 JSON本身，不要加任何說明文字、不要用markdown code fence包起來。',
    '',
    '使用者說：「' + text + '」',
    '',
    '請輸出符合以下格式的 JSON 物件（這句話沒提到的區塊請設為 null，不要留空物件）：',
    '{',
    '  "finance": {"type":"expense或income","amount":數字,"category":"從這些裡面選一個，或提出更合適的新分類：' + S.financeCategories.join('、') + '","account":"從這些裡面選一個：' + S.accounts.join('、') + '","note":"簡短備註"} 或 null,',
    '  "food": {"name":"食物名稱","calories":估算整數kcal,"mealType":"早餐、午餐、晚餐、點心其中之一","category":"從這些裡面選一個：' + S.foodCategories.join('、') + '"} 或 null,',
    '  "exercise": {"exerciseType":"運動類型","durationMinutes":整數,"caloriesBurned":估算整數kcal} 或 null,',
    '  "body": {"weight":數字,"bodyFat":數字或null,"visceralFat":數字或null} 或 null',
    '}',
    '',
    '注意：一句話可能同時包含飲食與記帳（例如吃了什麼、花多少錢），或同時包含運動，請盡量都解析出來；使用者沒說清楚的金額/熱量/分鐘數請合理估算，數字欄位只填數字，不要加符號或單位。'
  ];
  return lines.join('\n');
}

function safeParseJSON(t){
  try{
    var s = String(t).trim();
    var m = s.match(/\{[\s\S]*\}/);
    if(m) s = m[0];
    return JSON.parse(s);
  }catch(e){ return null; }
}

function callGemini(prompt){
  var cfg = S.aiConfig;
  var model = cfg.geminiModel || 'gemini-2.5-flash';
  var url = 'https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(cfg.geminiKey);
  return fetch(url, {
    method:'POST',
    headers:{ 'content-type':'application/json' },
    body: JSON.stringify({
      contents:[{ parts:[{ text: prompt }] }],
      generationConfig:{ responseMimeType:'application/json', temperature:0.2 }
    })
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error('Gemini API 錯誤 '+res.status+'：'+t.slice(0,200)); }); }
    return res.json();
  }).then(function(data){
    var parts = data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts;
    var t = parts && parts[0] && parts[0].text;
    if(!t) throw new Error('Gemini 沒有回傳內容，可能被安全過濾擋下或額度用盡');
    return t;
  });
}

function callClaude(prompt){
  var cfg = S.aiConfig;
  return fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': cfg.claudeKey,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model: cfg.claudeModel || 'claude-haiku-4-5',
      max_tokens: 500,
      messages:[{ role:'user', content: prompt }]
    })
  }).then(function(res){
    if(!res.ok){ return res.text().then(function(t){ throw new Error('Claude API 錯誤 '+res.status+'：'+t.slice(0,200)); }); }
    return res.json();
  }).then(function(data){
    var t = data && data.content && data.content[0] && data.content[0].text;
    if(!t) throw new Error('Claude 沒有回傳內容');
    return t;
  });
}

function parseWithAI(text){
  var cfg = S.aiConfig;
  var hasKey = cfg.provider==='gemini' ? !!cfg.geminiKey : !!cfg.claudeKey;
  if(!hasKey){
    UI.voiceState = 'idle';
    UI.voiceError = { title:'⚠ 尚未設定 API 金鑰', message:'請先到「設定」→「語音與 AI」填入你的 API 金鑰' };
    render();
    return;
  }
  UI.voiceState = 'processing';
  UI.voiceTranscript = text;
  UI.voiceError = null;
  render();

  var prompt = buildAIPrompt(text);
  var req = cfg.provider==='gemini' ? callGemini(prompt) : callClaude(prompt);
  req.then(function(resultText){
    var data = safeParseJSON(resultText);
    if(!data){ throw new Error('AI 回傳的內容不是有效的 JSON，請重試或改用手動輸入'); }
    if(!data.finance && !data.food && !data.exercise && !data.body){
      throw new Error('AI 沒有解析出任何可用的記錄，請講清楚一點或改用手動輸入');
    }
    applyAIResultToForm(data);
  }).catch(function(err){
    UI.voiceState = 'idle';
    UI.voiceError = { title:'⚠ AI 解析失敗', message:(err && err.message) ? err.message : '連線失敗，請確認網路與金鑰設定，或改用手動輸入' };
    render();
  });
}

function applyAIResultToForm(data){
  UI.voiceState = 'idle';
  UI.voiceOpen = false;
  UI.voiceError = null;
  UI.addTypes = {
    finance: !!data.finance,
    food: !!data.food,
    exercise: !!data.exercise,
    body: !!data.body
  };
  UI.prefill = {
    amount: data.finance ? data.finance.amount : '',
    category: data.finance ? data.finance.category : '',
    account: data.finance ? data.finance.account : '',
    note: data.finance ? data.finance.note : '',
    foodname: data.food ? data.food.name : '',
    cal: data.food ? data.food.calories : '',
    meal: data.food ? data.food.mealType : '',
    foodcat: data.food ? data.food.category : '',
    extype: data.exercise ? data.exercise.exerciseType : '',
    exdur: data.exercise ? data.exercise.durationMinutes : '',
    excal: data.exercise ? data.exercise.caloriesBurned : '',
    weight: data.body ? data.body.weight : '',
    fat: data.body ? data.body.bodyFat : '',
    visc: data.body ? data.body.visceralFat : ''
  };
  UI.showAddForm = true;
  render();
}

  });

    } else {
      html += renderAddForm();

    html += '<div class="card">';
    if(sorted.length===0) html += '<div class="empty-hint">還沒有飲食紀錄</div>';
    else sorted.forEach(function(r){
      html += '<div class="row"><div class="row-icon">🍱</div><div class="row-main"><div class="row-title">'+esc(r.name)+'</div>';
      html += '<div class="row-sub">'+esc(r.mealType)+' · '+esc(r.categoryName)+' · '+fmtDate(r.date)+' · 約'+r.calories+'kcal</div></div>';
      html += '<div class="row-del" onclick="delRecord(\'foodRecords\',\''+r.id+'\')">刪除</div></div>';
    });
    html += '</div>';
  }

  if(UI.recordsTab==='finance'){
    var sortedF = S.financeRecords.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    html += '<div class="card">';
    if(sortedF.length===0) html += '<div class="empty-hint">還沒有記帳紀錄</div>';
    else sortedF.forEach(function(r){
      html += '<div class="row"><div class="row-icon">'+(r.type==='expense'?'💸':'💵')+'</div><div class="row-main"><div class="row-title">'+esc(r.categoryName)+'</div>';
      html += '<div class="row-sub">'+esc(r.accountName)+' · '+esc(r.note)+' · '+fmtDate(r.date)+'</div></div>';
      html += '<div class="row-val'+(S.privacyMode?' blurred':'')+'" style="color:'+(r.type==='expense'?'var(--neg)':'var(--pos)')+'">'+(r.type==='expense'?'-':'+')+r.amount+'</div>';
      html += '<div class="row-del" onclick="delRecord(\'financeRecords\',\''+r.id+'\')">刪除</div></div>';
    });
    html += '</div>';
  }

  if(UI.recordsTab==='body'){
    var sortedB = S.bodyRecords.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
    html += '<div class="card">';
    if(sortedB.length===0) html += '<div class="empty-hint">還沒有體況紀錄</div>';
    else sortedB.forEach(function(r){
      var bmi = S.userProfile ? (r.weight/Math.pow(S.userProfile.heightCm/100,2)).toFixed(1) : null;
      html += '<div class="row"><div class="row-icon">💪</div><div class="row-main"><div class="row-title">'+fmtDate(r.date)+'</div>';
      html += '<div class="row-sub">'+(r.bodyFat?('體脂 '+r.bodyFat+'% · '):'')+(bmi?('BMI '+bmi):'')+'</div></div>';
      html += '<div class="row-val'+(S.privacyMode?' blurred':'')+'">'+r.weight+' kg</div>';
      html += '<div class="row-del" onclick="delRecord(\'bodyRecords\',\''+r.id+'\')">刪除</div></div>';
    });
    html += '</div>';
  }

  if(UI.recordsTab==='piggy'){
    html += renderPiggyTab();
  }

  html += '</div>';
  return html;
}

function setRecordsTab(t){ UI.recordsTab = t; UI.showAddForm = false; render(); }
function delRecord(listKey, id){
  S[listKey] = S[listKey].filter(function(r){ return r.id !== id; });
  saveData(); render();
}

function renderPiggyTab(){
  var balance = S.piggyRecords.reduce(function(s,r){ return s + (r.type==='deposit'?r.amount:-r.amount); }, 0);
  var goal = S.piggyGoal;
  var pct = goal ? Math.min(100, balance/goal*100) : 0;
  var html = '<div class="piggy-hero"><div class="piggy-label">🐷 金豬庫存</div>';
  html += '<div class="piggy-amount'+(S.privacyMode?' blurred':'')+'">$'+balance.toLocaleString()+'</div>';
  if(goal){ html += '<div class="row-sub">目標 $'+goal.toLocaleString()+' · 達成 '+pct.toFixed(1)+'%</div>'; }
  if(goal){ html += '<div class="piggy-progress"><div class="piggy-progress-fill" style="width:'+pct+'%"></div></div>'; }
  html += '</div>';
  html += '<div style="margin:10px 20px"><button class="btn btn-primary" onclick="togglePiggyForm()">＋ 存入/取出</button></div>';
  html += '<div id="piggyFormWrap"></div>';

  var sorted = S.piggyRecords.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  html += '<div class="card">';
  if(sorted.length===0) html += '<div class="empty-hint">還沒有金豬紀錄</div>';
  else sorted.forEach(function(r){
    html += '<div class="row"><div class="row-icon">'+(r.type==='deposit'?'➕':'➖')+'</div><div class="row-main"><div class="row-title">'+esc(r.source)+'</div><div class="row-sub">'+fmtDate(r.date)+'</div></div>';
    html += '<div class="row-val'+(S.privacyMode?' blurred':'')+'" style="color:'+(r.type==='deposit'?'var(--pos)':'var(--neg)')+'">'+(r.type==='deposit'?'+':'-')+r.amount+'</div>';
    html += '<div class="row-del" onclick="delRecord(\'piggyRecords\',\''+r.id+'\')">刪除</div></div>';
  });
  html += '</div>';
  return html;
}

var piggyFormType = 'deposit';
function togglePiggyForm(){
  var wrap = document.getElementById('piggyFormWrap');
  if(wrap.innerHTML.trim()!==''){ wrap.innerHTML = ''; return; }
  var html = '<div class="card"><div class="type-chips">';
  html += '<div class="type-chip active" data-t="deposit" onclick="selectPiggyType(this)">存入</div>';
  html += '<div class="type-chip" data-t="withdrawal" onclick="selectPiggyType(this)">取出</div></div>';
  html += '<div class="field-row"><div class="field"><label>金額</label><input type="text" id="pf_amount"></div>';
  html += '<div class="field"><label>來源/原因</label><input type="text" id="pf_source" value="薪資"></div></div>';
  html += '<button class="btn btn-primary btn-block" onclick="savePiggy()">儲存</button></div>';
  wrap.innerHTML = html;
  piggyFormType = 'deposit';
}
function selectPiggyType(el){
  piggyFormType = el.getAttribute('data-t');
  el.parentNode.querySelectorAll('.type-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
}
function savePiggy(){
  var amt = document.getElementById('pf_amount').value.trim();
  var src = document.getElementById('pf_source').value.trim();
  if(!amt) return;
  S.piggyRecords.push({ id:uid(), date:todayISO(), type:piggyFormType, amount:parseFloat(amt), source:src||'其他' });
  saveData(); render();
}

function renderTrends(){
  var html = '<div class="screen"><div class="topbar"><div class="title">趨勢</div></div>';

  var days = [];
  for(var i=6;i>=0;i--){ var d = new Date(); d.setDate(d.getDate()-i); days.push(d); }
  var calByDay = days.map(function(d){
    var sum = S.foodRecords.filter(function(r){
      var rd = new Date(r.date);
      return rd.getFullYear()===d.getFullYear() && rd.getMonth()===d.getMonth() && rd.getDate()===d.getDate();
    }).reduce(function(s,r){return s+r.calories;},0);
    return { label:(d.getMonth()+1)+'/'+d.getDate(), value:sum };
  });
  var maxCal = Math.max.apply(null, [1].concat(calByDay.map(function(x){return x.value;})));

  html += '<div class="card"><div class="card-label">近7天熱量攝取</div><div class="bars-wrap">';
  calByDay.forEach(function(d){
    html += '<div class="bar-col"><div class="bar-chart"><div class="bar" style="height:'+(d.value/maxCal*80)+'px"></div></div><div class="bar-label">'+d.label+'</div></div>';
  });
  html += '</div></div>';

  var now = new Date();
  var monthFin = S.financeRecords.filter(function(r){
    var rd = new Date(r.date);
    return rd.getFullYear()===now.getFullYear() && rd.getMonth()===now.getMonth();
  });
  var income = monthFin.filter(function(r){return r.type==='income';}).reduce(function(s,r){return s+r.amount;},0);
  var expense = monthFin.filter(function(r){return r.type==='expense';}).reduce(function(s,r){return s+r.amount;},0);

  html += '<div class="card"><div class="card-label">本月收支</div><div style="display:flex;gap:20px">';
  html += '<div><div class="row-sub">收入</div><div class="'+(S.privacyMode?'blurred':'')+'" style="color:var(--pos);font-size:18px;font-weight:600">$'+income.toLocaleString()+'</div></div>';
  html += '<div><div class="row-sub">支出</div><div class="'+(S.privacyMode?'blurred':'')+'" style="color:var(--neg);font-size:18px;font-weight:600">$'+expense.toLocaleString()+'</div></div>';
  html += '</div></div>';

  var catTotals = {};
  monthFin.filter(function(r){return r.type==='expense';}).forEach(function(r){ catTotals[r.categoryName] = (catTotals[r.categoryName]||0) + r.amount; });
  var catList = Object.keys(catTotals).map(function(k){return [k,catTotals[k]];}).sort(function(a,b){return b[1]-a[1];});
  var maxCat = Math.max.apply(null, [1].concat(catList.map(function(x){return x[1];})));

  html += '<div class="card"><div class="card-label">本月支出排行</div>';
  if(catList.length===0) html += '<div class="empty-hint">本月尚無支出</div>';
  else catList.forEach(function(entry){
    html += '<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">';
    html += '<span>'+esc(entry[0])+'</span><span class="'+(S.privacyMode?'blurred':'')+'">$'+entry[1].toLocaleString()+'</span></div>';
    html += '<div style="height:5px;background:var(--card-2);border-radius:4px;overflow:hidden"><div style="height:100%;width:'+(entry[1]/maxCat*100)+'%;background:var(--brass)"></div></div></div>';
  });
  html += '</div>';

  var sortedBody = S.bodyRecords.slice().sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  html += '<div class="card"><div class="card-label">體重趨勢</div>';
  if(sortedBody.length===0) html += '<div class="empty-hint">還沒有體況紀錄</div>';
  else{
    var weights = sortedBody.map(function(r){return r.weight;});
    var minW = Math.min.apply(null, weights), maxW = Math.max.apply(null, weights);
    var range = (maxW-minW)||1;
    var pts = weights.map(function(w,i){
      var x = weights.length>1 ? i/(weights.length-1)*300 : 150;
      var y = 70 - ((w-minW)/range*60);
      return x+','+y;
    }).join(' ');
    html += '<svg viewBox="0 0 300 80" style="width:100%"><polyline points="'+pts+'" fill="none" stroke="#C9A03D" stroke-width="2.2" stroke-linecap="round"/></svg>';
  }
  html += '</div>';

  var goal = S.personalGoal;
  if(goal){
    var piggyBalance = S.piggyRecords.reduce(function(s,r){ return s + (r.type==='deposit'?r.amount:-r.amount); }, 0);
    var goalProgress = null;
    if(goal.type==='weight' && sortedBody.length>0 && S.userProfile){
      var start = S.userProfile.weightKg, current = sortedBody[sortedBody.length-1].weight, target = goal.targetValue;
      var total = Math.abs(start-target)||1;
      goalProgress = Math.min(100, Math.abs(start-current)/total*100);
    } else if(goal.type==='savings' && goal.targetValue){
      goalProgress = Math.min(100, piggyBalance/goal.targetValue*100);
    }
    html += '<div class="goal-card"><div class="card-label">🎯 目標與獎勵</div><div style="font-size:13px;margin-bottom:6px">';
    if(goal.type==='weight') html += '目標體重 '+goal.targetValue+' kg';
    if(goal.type==='savings') html += '目標存款 $'+(goal.targetValue?goal.targetValue.toLocaleString():'');
    if(goal.type==='custom') html += esc(goal.targetText);
    html += '</div>';
    if(goalProgress!==null) html += '<div class="goal-track"><div class="goal-track-fill" style="width:'+goalProgress+'%"></div></div>';
    html += '<div class="row-sub" style="margin-top:10px">🎁 達成後獎勵：'+esc(goal.rewardText)+'</div></div>';
  }

  html += '</div>';
  return html;
}

function renderSettings(){
  var html = '<div class="screen"><div class="topbar"><div class="title">設定</div></div>';

  html += '<div class="group-label">預算與目標</div>';
  html += '<div class="card"><div class="card-label">月預算</div><div class="field-row">';
  html += '<input type="text" id="set_budget" value="'+(S.budget.monthlyAmount||'')+'" placeholder="例：25000">';
  html += '<button class="btn btn-secondary" onclick="saveBudget()">儲存</button></div></div>';

  html += '<div class="card"><div class="card-label">金豬罐年度目標</div><div class="field-row">';
  html += '<input type="text" id="set_piggygoal" value="'+(S.piggyGoal||'')+'" placeholder="例：100000">';
  html += '<button class="btn btn-secondary" onclick="savePiggyGoal()">儲存</button></div></div>';

  html += '<div class="group-label">分類與帳戶</div>';
  html += renderChipManager('記帳分類管理','financeCategories');
  html += renderChipManager('帳戶管理','accounts');
  html += renderChipManager('飲食分類管理','foodCategories');

  html += '<div class="group-label">語音與 AI</div>';
  html += '<div class="card">';
  html += '<div class="card-label">AI 供應商</div>';
  html += '<div class="type-chips" id="aiProviderRow">';
  html += '<div class="type-chip'+(S.aiConfig.provider==='gemini'?' active':'')+'" data-p="gemini" onclick="setAIProvider(this)">Google Gemini（有免費額度）</div>';
  html += '<div class="type-chip'+(S.aiConfig.provider==='claude'?' active':'')+'" data-p="claude" onclick="setAIProvider(this)">Anthropic Claude</div>';
  html += '</div>';

  html += '<div id="aiBlock-gemini" style="display:'+(S.aiConfig.provider==='gemini'?'block':'none')+'">';
  html += '<div class="field"><label>Gemini API 金鑰</label><input type="text" id="ai_gemini_key" value="'+esc(S.aiConfig.geminiKey)+'" placeholder="AIza..."></div>';
  html += '<div class="field"><label>模型 ID（免費額度模型若已更新請自行更改）</label><input type="text" id="ai_gemini_model" value="'+esc(S.aiConfig.geminiModel)+'" placeholder="gemini-2.5-flash"></div>';
  html += '</div>';

  html += '<div id="aiBlock-claude" style="display:'+(S.aiConfig.provider==='claude'?'block':'none')+'">';
  html += '<div class="field"><label>Anthropic API 金鑰</label><input type="text" id="ai_claude_key" value="'+esc(S.aiConfig.claudeKey)+'" placeholder="sk-ant-..."></div>';
  html += '<div class="field"><label>模型 ID</label><input type="text" id="ai_claude_model" value="'+esc(S.aiConfig.claudeModel)+'" placeholder="claude-haiku-4-5"></div>';
  html += '</div>';

  html += '<button class="btn btn-secondary btn-block" onclick="saveAIConfig()">儲存 AI 設定</button>';
  html += '<div class="row-sub" style="margin-top:10px;line-height:1.6">金鑰只存在這個瀏覽器的 localStorage，語音逐字稿會直接從你的裝置送到你選擇的 AI 服務解析，不會經過其他伺服器。但這代表金鑰會出現在瀏覽器開發者工具的網路請求中——請勿把這個檔案分享給別人，並建議到金鑰供應商後台設定用量上限。</div>';
  html += '</div>';

  html += '<div class="group-label">資料</div>';
  html += '<div class="card"><button class="btn btn-secondary btn-block" style="margin-bottom:8px" onclick="exportJSON()">⬇ 匯出所有資料(JSON)</button>';
  html += '<button class="btn btn-danger btn-block" onclick="clearAllData()">清除所有資料</button></div>';

  html += '<div class="group-label">關於</div>';
  html += '<div class="card"><div class="row-sub">版本 1.1.0（網頁版 · 含語音+AI解析）</div>';
  html += '<div class="row-sub" style="margin-top:8px;line-height:1.6">熱量與營養素數值為估算，僅供參考，非醫療建議。所有資料儲存在這個瀏覽器的localStorage裡，換裝置或清除瀏覽器資料會遺失，請定期使用上方「匯出資料」備份。</div></div>';

  html += '</div>';
  return html;
}

function setAIProvider(el){
  var p = el.getAttribute('data-p');
  S.aiConfig.provider = p;
  document.querySelectorAll('#aiProviderRow .type-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  var gb = document.getElementById('aiBlock-gemini'), cb = document.getElementById('aiBlock-claude');
  if(gb) gb.style.display = p==='gemini' ? 'block' : 'none';
  if(cb) cb.style.display = p==='claude' ? 'block' : 'none';
}
function saveAIConfig(){
  var gk = document.getElementById('ai_gemini_key'), gm = document.getElementById('ai_gemini_model');
  var ck = document.getElementById('ai_claude_key'), cm = document.getElementById('ai_claude_model');
  if(gk) S.aiConfig.geminiKey = gk.value.trim();
  if(gm) S.aiConfig.geminiModel = gm.value.trim() || 'gemini-2.5-flash';
  if(ck) S.aiConfig.claudeKey = ck.value.trim();
  if(cm) S.aiConfig.claudeModel = cm.value.trim() || 'claude-haiku-4-5';
  saveData();
}

function renderChipManager(title, key){
  var html = '<div class="card"><div class="card-label">'+title+'</div><div class="chip-list">';
  S[key].forEach(function(item,i){
    html += '<div class="chip">'+esc(item)+' <span class="del" onclick="delChip(\''+key+'\','+i+')">✕</span></div>';
  });
  html += '</div><div class="add-row"><input type="text" id="newchip_'+key+'" placeholder="新增...">';
  html += '<button class="btn btn-primary" onclick="addChip(\''+key+'\')">＋</button></div></div>';
  return html;
}
function addChip(key){
  var input = document.getElementById('newchip_'+key);
  var val = input.value.trim();
  if(!val) return;
  S[key].push(val);
  saveData(); render();
}
function delChip(key, idx){
  S[key].splice(idx,1);
  saveData(); render();
}
function saveBudget(){
  var v = document.getElementById('set_budget').value.trim();
  S.budget.monthlyAmount = v ? parseFloat(v) : null;
  saveData(); render();
}
function savePiggyGoal(){
  var v = document.getElementById('set_piggygoal').value.trim();
  S.piggyGoal = v ? parseFloat(v) : null;
  saveData(); render();
}
function exportJSON(){
  var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'raylife-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function clearAllData(){
  if(window.confirm('確定清除所有資料嗎？此動作無法復原')){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

render();
</script>
</body>
</html>
